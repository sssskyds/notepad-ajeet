<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="color-scheme" content="light dark"/>
<title>NovaPad — Browser Notepad</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232783DE'/%3E%3Cpath d='M9 23V9h3l8 10V9h3v14h-3L12 13v10z' fill='white'/%3E%3C/svg%3E"/>
<style>
/* ============ THEMES ============ */
:root{
  --bg:#FFFFFF; --surface:#F9F8F7; --surface-2:#F0EFED; --raised:#FFFFFF;
  --border:#E6E5E3; --border-strong:#D8D6D3;
  --text:#2C2C2B; --muted:#7D7A75; --faint:#B4B1AC;
  --accent:#2783DE; --accent-soft:#E5F2FC; --accent-text:#1D6FC0;
  --green:#46A171; --green-soft:#E8F1EC; --orange:#D5803B; --orange-soft:#FBEBDE; --red:#E56458; --red-soft:#FCE9E7;
  --sel:rgba(39,131,222,.22); --cur-line:rgba(39,131,222,.055);
  --mark:rgba(229,178,57,.35); --mark-active:rgba(229,140,57,.6);
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.09);
  --tok-com:#9A9891; --tok-str:#2E7D32; --tok-num:#B45309; --tok-key:#7C3AED;
  --tok-fn:#1D6FC0; --tok-lit:#0F766E; --tok-tag:#C62828; --tok-attr:#B45309; --tok-punc:#7D7A75;
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --font-serif:Georgia,"Times New Roman",serif;
  --radius:8px; --tr:150ms ease;
}
[data-theme="dark"]{
  --bg:#191919; --surface:#202020; --surface-2:#2A2A2A; --raised:#252525;
  --border:rgba(255,255,255,.13); --border-strong:rgba(255,255,255,.22);
  --text:#EDEDEC; --muted:rgba(255,255,255,.6); --faint:rgba(255,255,255,.32);
  --accent:#5E9FE8; --accent-soft:rgba(94,159,232,.14); --accent-text:#7FB4EF;
  --green:#72BC8F; --green-soft:rgba(114,188,143,.12); --orange:#DE9255; --orange-soft:rgba(222,146,85,.12); --red:#E97366; --red-soft:rgba(233,115,102,.12);
  --sel:rgba(94,159,232,.3); --cur-line:rgba(255,255,255,.045);
  --mark:rgba(234,194,107,.3); --mark-active:rgba(234,194,107,.55);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 32px rgba(0,0,0,.5);
  --tok-com:#7A7A78; --tok-str:#A5D6A7; --tok-num:#F2C97D; --tok-key:#C792EA;
  --tok-fn:#82AAFF; --tok-lit:#4FB9C9; --tok-tag:#F07178; --tok-attr:#FFCB6B; --tok-punc:rgba(255,255,255,.55);
}
[data-theme="sepia"]{
  --bg:#F6F3EB; --surface:#EFEBE0; --surface-2:#E7E2D4; --raised:#FCFAF4;
  --border:#DED8C8; --border-strong:#CCC5B2;
  --text:#3A342A; --muted:#847C6C; --faint:#B5AD9A;
  --accent:#0F766E; --accent-soft:#DCEBE8; --accent-text:#0B5D57;
  --sel:rgba(15,118,110,.2); --cur-line:rgba(15,118,110,.055);
  --mark:rgba(213,128,59,.28); --mark-active:rgba(213,128,59,.55);
  --tok-com:#A39A85; --tok-str:#3F6E37; --tok-num:#A05E17; --tok-key:#8A4A9D;
  --tok-fn:#155E9C; --tok-lit:#0F766E; --tok-tag:#B03A2E; --tok-attr:#A05E17; --tok-punc:#847C6C;
}
[data-theme="nord"]{
  --bg:#2E3440; --surface:#353C4A; --surface-2:#3B4252; --raised:#3B4252;
  --border:rgba(216,222,233,.13); --border-strong:rgba(216,222,233,.24);
  --text:#ECEFF4; --muted:#AEB6C5; --faint:#6A7386;
  --accent:#88C0D0; --accent-soft:rgba(136,192,208,.14); --accent-text:#9FD0DE;
  --green:#A3BE8C; --orange:#D08770; --red:#BF616A;
  --sel:rgba(136,192,208,.28); --cur-line:rgba(236,239,244,.045);
  --mark:rgba(235,203,139,.3); --mark-active:rgba(235,203,139,.55);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 32px rgba(0,0,0,.45);
  --tok-com:#7B88A1; --tok-str:#A3BE8C; --tok-num:#B48EAD; --tok-key:#81A1C1;
  --tok-fn:#88C0D0; --tok-lit:#D08770; --tok-tag:#BF616A; --tok-attr:#EBCB8B; --tok-punc:#AEB6C5;
}

/* ============ BASE ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-ui);font-size:13px;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;transition:background var(--tr),color var(--tr)}
button{font-family:var(--font-ui);color:inherit}
svg{display:block}
::selection{background:var(--sel)}
kbd{font-family:var(--font-ui);font-size:10.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:1px 5px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}

/* ============ TOOLBAR ============ */
#toolbar{display:flex;align-items:center;gap:2px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;user-select:none;flex-wrap:wrap}
#brand{display:flex;align-items:center;gap:8px;margin-right:10px}
#brand .logo{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent-text));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;letter-spacing:-.5px}
#brand .name{font-weight:600;font-size:13.5px;letter-spacing:-.1px}
#brand .name em{font-style:normal;color:var(--muted);font-weight:400}
.tb-sep{width:1px;height:18px;background:var(--border);margin:0 6px;flex-shrink:0}
.tb-btn{display:flex;align-items:center;justify-content:center;gap:5px;height:30px;min-width:30px;padding:0 7px;border:none;background:none;color:var(--muted);border-radius:var(--radius);cursor:pointer;font-size:12px;transition:background var(--tr),color var(--tr);white-space:nowrap;position:relative}
.tb-btn:hover{background:var(--surface-2);color:var(--text)}
.tb-btn:focus-visible,.tab:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tb-btn.on{background:var(--accent-soft);color:var(--accent-text)}
.tb-btn svg{width:15px;height:15px;flex-shrink:0}
.tb-btn .cx{font-size:12px}
#tb-right{margin-left:auto;display:flex;align-items:center;gap:6px}
#save-pill{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--border);font-size:11px;color:var(--muted);background:var(--bg);white-space:nowrap;transition:all var(--tr)}
#save-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);transition:background var(--tr)}
#save-pill.saved{color:var(--green);border-color:transparent;background:var(--green-soft)}
#save-pill.saved .dot{background:var(--green)}
#save-pill.saving{color:var(--orange);background:var(--orange-soft);border-color:transparent}
#save-pill.saving .dot{background:var(--orange);animation:pulse 1s ease infinite}
@keyframes pulse{50%{opacity:.35}}

/* ============ MENUS ============ */
.menu-wrap{position:relative}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:230px;background:var(--raised);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:5px;z-index:120;display:none;max-height:70vh;overflow-y:auto}
.menu.open{display:block}
.menu.right{left:auto;right:0}
.mi{display:flex;align-items:center;gap:9px;width:100%;padding:6px 9px;border:none;background:none;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--text);text-align:left}
.mi:hover{background:var(--surface-2)}
.mi svg{width:14px;height:14px;color:var(--muted);flex-shrink:0}
.mi .sc{margin-left:auto;padding-left:16px}
.mi.danger{color:var(--red)}
.m-label{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding:7px 9px 3px}
.m-div{height:1px;background:var(--border);margin:5px 4px}

/* ============ TAB BAR ============ */
#tab-bar{display:flex;align-items:center;gap:3px;padding:6px 10px 0;background:var(--surface);overflow-x:auto;flex-shrink:0;user-select:none;scrollbar-width:thin}
#tab-bar::-webkit-scrollbar{height:4px}
#tab-bar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.tab{display:flex;align-items:center;gap:7px;padding:6px 8px 6px 12px;border-radius:8px 8px 0 0;border:1px solid transparent;border-bottom:none;cursor:pointer;font-size:12.5px;color:var(--muted);background:transparent;white-space:nowrap;max-width:220px;position:relative;transition:background var(--tr),color var(--tr)}
.tab:hover{background:var(--surface-2);color:var(--text)}
.tab.active{background:var(--bg);border-color:var(--border);color:var(--text);box-shadow:0 1px 0 var(--bg)}
.tab .t-name{overflow:hidden;text-overflow:ellipsis;max-width:150px}
.tab .t-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;display:none}
.tab.unsaved .t-dot{display:block}
.tab .t-x{width:16px;height:16px;display:flex;align-items:center;justify-content:center;border-radius:4px;border:none;background:none;cursor:pointer;color:var(--faint);flex-shrink:0}
.tab .t-x:hover{background:var(--border);color:var(--text)}
.tab .t-x svg{width:10px;height:10px}
.tab input.rename{border:1px solid var(--accent);border-radius:4px;background:var(--bg);color:var(--text);font-size:12px;padding:1px 4px;width:110px;font-family:var(--font-ui)}
.tab.dragover{box-shadow:inset 3px 0 0 var(--accent)}
#new-tab{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border:none;background:none;border-radius:7px;cursor:pointer;color:var(--muted);flex-shrink:0;margin-bottom:2px}
#new-tab:hover{background:var(--surface-2);color:var(--text)}
#new-tab svg{width:14px;height:14px}
#tab-edge{height:1px;background:var(--border);flex-shrink:0}

/* ============ FIND BAR ============ */
#find-bar{display:none;align-items:center;gap:6px;padding:7px 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
#find-bar.open{display:flex}
#find-bar .f-in{display:flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:0 4px 0 8px;height:28px}
#find-bar .f-in:focus-within{border-color:var(--accent)}
#find-bar input{border:none;background:none;color:var(--text);font-size:12.5px;width:170px;height:100%;outline:none}
.f-opt{width:22px;height:22px;display:flex;align-items:center;justify-content:center;border:none;background:none;border-radius:5px;cursor:pointer;color:var(--faint);font-size:10.5px;font-weight:600}
.f-opt:hover{color:var(--text);background:var(--surface-2)}
.f-opt.on{background:var(--accent-soft);color:var(--accent-text)}
#find-count{font-size:11.5px;color:var(--muted);min-width:66px;text-align:center}
.f-btn{height:26px;padding:0 9px;border:1px solid var(--border);border-radius:7px;background:var(--bg);cursor:pointer;font-size:11.5px;color:var(--text);display:flex;align-items:center;gap:4px}
.f-btn:hover{background:var(--surface-2)}
.f-btn svg{width:12px;height:12px}

/* ============ MAIN / EDITOR ============ */
#main{flex:1;display:flex;overflow:hidden;background:var(--bg)}
#editor-pane{flex:1;position:relative;overflow:hidden;min-width:0}
#gutter-strip{position:absolute;left:0;top:0;bottom:0;width:var(--gw,52px);background:var(--bg);z-index:0;display:var(--gd,block)}
#hl,#input{font-family:var(--font-code,var(--font-mono));font-size:var(--fs,14px);line-height:var(--lh,1.65);tab-size:var(--ts,2);font-variant-ligatures:none;letter-spacing:0}
#hl{position:absolute;top:0;left:0;bottom:0;right:0;margin:0;overflow:hidden;z-index:1;padding:14px 24px 45vh 0;white-space:pre-wrap;overflow-wrap:break-word;color:var(--text)}
#input{position:absolute;inset:0;z-index:2;border:none;resize:none;background:transparent;color:transparent;caret-color:var(--text);outline:none;overflow:auto;padding:14px 24px 45vh calc(var(--gw,52px) + 14px);white-space:pre-wrap;overflow-wrap:break-word;scrollbar-width:thin}
.nowrap #hl,.nowrap #input{white-space:pre;overflow-wrap:normal}
#hl .line{position:relative;padding-left:calc(var(--gw,52px) + 14px);min-height:calc(var(--fs,14px) * var(--lh,1.65))}
#hl .line.cur{background:var(--cur-line)}
#hl .ln{position:absolute;left:0;top:0;width:var(--gw,52px);padding-right:14px;text-align:right;color:var(--faint);user-select:none;font-size:calc(var(--fs,14px) * .82);line-height:calc(var(--fs,14px) * var(--lh,1.65));transform:translateX(var(--sx,0px));display:var(--gd,block)}
#hl .line.cur .ln{color:var(--muted)}
.no-gutter #hl .line{padding-left:14px}
.no-gutter #input{padding-left:14px}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0}
mark.cm{background:var(--mark-active);outline:1px solid var(--orange)}

/* multi-cursor / column select */
#mc-layer{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
#mc-layer .mc-sel{position:absolute;background:var(--accent);opacity:.3;border-radius:2px}
#mc-layer .mc-caret{position:absolute;width:2px;margin-left:-1px;border-radius:1px;background:var(--accent-text);animation:mc-blink 1.1s steps(1) infinite}
@keyframes mc-blink{50%{opacity:0}}
body.mc-on #input{caret-color:transparent}
.tk-com{color:var(--tok-com);font-style:italic}.tk-str{color:var(--tok-str)}.tk-num{color:var(--tok-num)}.tk-key{color:var(--tok-key)}.tk-fn{color:var(--tok-fn)}.tk-lit{color:var(--tok-lit)}.tk-tag{color:var(--tok-tag)}.tk-attr{color:var(--tok-attr)}.tk-punc{color:var(--tok-punc)}
.tk-h{color:var(--tok-fn);font-weight:700}.tk-b{font-weight:700}.tk-i{font-style:italic}.tk-cd{color:var(--tok-num);background:var(--surface-2);border-radius:3px}.tk-lnk{color:var(--accent-text);text-decoration:underline}.tk-q{color:var(--tok-com)}

/* empty state */
#empty-hint{position:absolute;z-index:1;top:14px;left:calc(var(--gw,52px) + 14px);color:var(--faint);pointer-events:none;font-size:var(--fs,14px);font-family:var(--font-code,var(--font-mono));display:none}
#empty-hint.show{display:block}

/* ============ PREVIEW ============ */
#preview{display:none;width:46%;min-width:280px;max-width:60%;border-left:1px solid var(--border);overflow-y:auto;background:var(--bg);flex-shrink:0}
body.preview-on #preview{display:block}
#preview-inner{padding:28px 36px 80px;max-width:760px;font-size:15px;line-height:1.65}
#preview-inner h1,#preview-inner h2,#preview-inner h3,#preview-inner h4{margin:1.1em 0 .45em;line-height:1.25;letter-spacing:-.01em}
#preview-inner h1{font-size:1.9em}#preview-inner h2{font-size:1.5em}#preview-inner h3{font-size:1.2em}#preview-inner h4{font-size:1.05em}
#preview-inner p{margin:.55em 0}
#preview-inner ul,#preview-inner ol{margin:.55em 0;padding-left:1.5em}
#preview-inner li{margin:.22em 0}
#preview-inner code{font-family:var(--font-mono);font-size:.88em;background:var(--surface-2);padding:1.5px 5px;border-radius:4px}
#preview-inner pre{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;overflow-x:auto;margin:.7em 0}
#preview-inner pre code{background:none;padding:0;font-size:.85em}
#preview-inner blockquote{border-left:3px solid var(--border-strong);padding:2px 0 2px 14px;color:var(--muted);margin:.7em 0}
#preview-inner hr{border:none;border-top:1px solid var(--border);margin:1.4em 0}
#preview-inner a{color:var(--accent-text)}
#preview-inner table{border-collapse:collapse;margin:.8em 0;width:100%}
#preview-inner th,#preview-inner td{border:1px solid var(--border);padding:6px 10px;text-align:left;font-size:.92em}
#preview-inner th{background:var(--surface)}
#preview-inner img{max-width:100%;border-radius:8px}
#preview-inner input[type=checkbox]{margin-right:6px}

/* ============ STATUS BAR ============ */
#statusbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px;height:28px;background:var(--surface);border-top:1px solid var(--border);font-size:11.5px;color:var(--muted);flex-shrink:0;user-select:none;overflow:hidden}
.sb-l,.sb-r{display:flex;align-items:center;gap:2px;min-width:0}
.sb-item{display:flex;align-items:center;gap:5px;padding:3px 7px;border-radius:5px;border:none;background:none;font-size:11.5px;color:var(--muted);white-space:nowrap;cursor:default}
button.sb-item{cursor:pointer}
button.sb-item:hover{background:var(--surface-2);color:var(--text)}
.sb-item b{font-weight:600;color:var(--text)}
.sb-item svg{width:11px;height:11px}

/* ============ OVERLAYS ============ */
.overlay{display:none;position:fixed;inset:0;background:rgba(15,15,15,.35);z-index:200;align-items:flex-start;justify-content:center;backdrop-filter:blur(2px)}
.overlay.open{display:flex}
.card{background:var(--raised);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);width:min(480px,calc(100vw - 32px));margin-top:9vh;overflow:hidden;display:flex;flex-direction:column;max-height:80vh}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 0}
.card-head h3{font-size:14.5px;font-weight:600;letter-spacing:-.1px}
.card-x{width:26px;height:26px;border:none;background:none;border-radius:6px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center}
.card-x:hover{background:var(--surface-2);color:var(--text)}
.card-x svg{width:13px;height:13px}
.card-body{padding:14px 18px 18px;overflow-y:auto}
.card-foot{display:flex;justify-content:flex-end;gap:8px;padding:0 18px 16px}
.btn{height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:12.5px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--red)}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input[type=text],.field select{width:100%;height:32px;padding:0 9px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:12.5px;font-family:var(--font-ui)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;font-size:12.5px}
.check span small{display:block;color:var(--muted);font-size:11px;margin-top:1px}
.sw{position:relative;width:34px;height:20px;flex-shrink:0}
.sw input{opacity:0;width:100%;height:100%;position:absolute;cursor:pointer;z-index:1;margin:0}
.sw i{position:absolute;inset:0;background:var(--border-strong);border-radius:999px;transition:background var(--tr)}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform var(--tr);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw input:checked + i{background:var(--accent)}
.sw input:checked + i::after{transform:translateX(14px)}

/* palette */
#palette-card{width:min(560px,calc(100vw - 32px));margin-top:9vh}
#pal-in{display:flex;align-items:center;gap:9px;padding:13px 16px;border-bottom:1px solid var(--border)}
#pal-in svg{width:15px;height:15px;color:var(--muted);flex-shrink:0}
#pal-in input{flex:1;border:none;background:none;color:var(--text);font-size:14px;outline:none;font-family:var(--font-ui)}
#pal-list{overflow-y:auto;max-height:52vh;padding:6px}
.pal-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:none;background:none;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text);text-align:left}
.pal-item svg{width:14px;height:14px;color:var(--muted);flex-shrink:0}
.pal-item.sel{background:var(--accent-soft)}
.pal-item .cat{color:var(--faint);font-size:11px;margin-left:4px}
.pal-item .sc{margin-left:auto}
.pal-empty{padding:22px;text-align:center;color:var(--muted);font-size:12.5px}

/* stats grid */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.stat .v{font-size:17px;font-weight:650;letter-spacing:-.02em}
.stat .k{font-size:10.5px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}

/* shortcuts */
.sc-row{display:flex;align-items:center;justify-content:space-between;padding:6px 2px;font-size:12.5px;border-bottom:1px solid var(--border)}
.sc-row:last-child{border-bottom:none}

/* ============ TOAST ============ */
#toast-zone{position:fixed;bottom:42px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--raised);border:1px solid var(--border);color:var(--text);padding:9px 16px;border-radius:999px;font-size:12.5px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;animation:t-in .18s ease;max-width:calc(100vw - 40px)}
.toast svg{width:14px;height:14px;flex-shrink:0}
.toast.ok svg{color:var(--green)}.toast.err svg{color:var(--red)}.toast.info svg{color:var(--accent)}
.toast.hide{opacity:0;transform:translateY(8px);transition:all .25s ease}
@keyframes t-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ============ DROP ZONE ============ */
#drop-veil{display:none;position:fixed;inset:0;z-index:500;background:rgba(39,131,222,.08);align-items:center;justify-content:center}
#drop-veil.show{display:flex}
#drop-veil .in{border:2px dashed var(--accent);border-radius:16px;background:var(--raised);padding:34px 54px;font-size:15px;font-weight:600;color:var(--accent-text);display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
#drop-veil svg{width:22px;height:22px}

/* ============ ZEN ============ */
body.zen #toolbar,body.zen #tab-bar,body.zen #tab-edge,body.zen #find-bar,body.zen #statusbar{display:none}
body.zen #hl .line{padding-left:14px}
body.zen #input{padding-left:14px}
body.zen #hl .ln,body.zen #gutter-strip{display:none}
body.zen #editor-pane{max-width:820px;margin:0 auto;width:100%}
body.zen #main{background:var(--bg)}
#zen-exit{display:none;position:fixed;top:14px;right:16px;z-index:150;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--raised);color:var(--muted);font-size:11.5px;cursor:pointer;align-items:center;gap:6px;box-shadow:var(--shadow);opacity:.35;transition:opacity var(--tr)}
#zen-exit:hover{opacity:1;color:var(--text)}
body.zen #zen-exit{display:flex}
#zen-exit svg{width:12px;height:12px}

/* ============ PRINT ============ */
#print-src{display:none}
@media print{
  body>*{display:none!important}
  #print-src{display:block!important;white-space:pre-wrap;font-family:var(--font-mono);font-size:11pt;color:#000}
}

/* ============ RESPONSIVE ============ */
@media (max-width:760px){
  #brand .name{display:none}
  .tb-btn .cx{display:none}
  #save-pill span{display:none}
  #preview{width:100%;max-width:100%;position:absolute;inset:0;z-index:5}
  .sb-item.hide-sm{display:none}
  #toolbar{padding:6px 8px}
}
</style>

<script>
"use strict";
/* ================================================================
   NovaPad — self-contained browser notepad. No dependencies.
   ================================================================ */
const $=id=>document.getElementById(id);
const ta=$('input'), hlPre=$('hl'), hlCode=$('hl-code'), pane=$('editor-pane');
const LS='novapad.v2';
const IS_MAC=/Mac|iP(hone|ad|od)/.test(navigator.platform);
const MOD=IS_MAC?'\u2318':'Ctrl';

let tabs=[],active=0,tabSeq=1,untitledSeq=1;

const LANGS={text:'Plain text',markdown:'Markdown',javascript:'JavaScript',html:'HTML',css:'CSS',python:'Python',json:'JSON',sql:'SQL',shell:'Shell',c:'C / C++ / Java',xml:'XML'};
const EXT2LANG={js:'javascript',mjs:'javascript',ts:'javascript',jsx:'javascript',md:'markdown',markdown:'markdown',html:'html',htm:'html',css:'css',py:'python',json:'json',sql:'sql',sh:'shell',bash:'shell',zsh:'shell',c:'c',h:'c',cpp:'c',cc:'c',hpp:'c',java:'c',cs:'c',xml:'xml',svg:'xml',txt:'text',log:'text',csv:'text'};
const COMMENT_PREFIX={javascript:'//',c:'//',css:'/*',python:'#',shell:'#',sql:'--',html:'<!--',xml:'<!--',markdown:'>',json:'//',text:'#'};

const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const sp=(c,s)=>'<span class="tk-'+c+'">'+esc(s)+'</span>';

/* ============ TOKENIZERS ============ */
const KW={
 javascript:'var let const function return if else for while do switch case break continue new delete typeof instanceof in of class extends super this import export from default try catch finally throw yield async await static get set void with debugger',
 c:'int long short char float double void unsigned signed struct union enum typedef sizeof return if else for while do switch case break continue goto static extern const volatile inline public private protected class new delete this namespace using template typename virtual override boolean byte implements interface throws synchronized abstract final package String',
 python:'def class return if elif else for while break continue pass import from as with lambda try except finally raise global nonlocal assert yield del in is not and or async await match case print self',
 sql:'select from where and or not insert into values update set delete create table drop alter add column primary key foreign references join left right inner outer full cross on as order by group having limit offset distinct union all exists between like in is null default index view trigger begin commit rollback transaction case when then else end count sum avg min max',
 shell:'if then else elif fi for while until do done case esac function in echo exit return local export readonly cd source set unset shift trap read'
};
const LITS={javascript:'true false null undefined NaN Infinity',c:'true false NULL nullptr',python:'True False None',json:'true false null',sql:'null true false',shell:''};

function readStr(line,i,q){let j=i+1;while(j<line.length){if(line[j]==='\\')j+=2;else if(line[j]===q){j++;break}else j++}return line.slice(i,j)}

function mkClike(lang){
  const kw=new Set((KW[lang==='json'?'javascript':lang]||'').split(' ').filter(Boolean));
  const lit=new Set((LITS[lang]||'').split(' ').filter(Boolean));
  const lc=lang==='sql'?'--':(lang==='python'||lang==='shell'?'#':'//');
  const hasBlock=(lang!=='python'&&lang!=='shell'&&lang!=='json');
  const ci=lang==='sql';
  return function(line,st){
    let out='',i=0;const n=line.length;
    if(st===1){const e=line.indexOf('*/');if(e<0)return{h:sp('com',line),st:1};out+=sp('com',line.slice(0,e+2));i=e+2;st=0}
    while(i<n){
      const c=line[i];
      if(lc&&line.startsWith(lc,i)&&!(lang==='shell'&&i>0&&line[i-1]==='$')){out+=sp('com',line.slice(i));i=n;break}
      if(hasBlock&&line.startsWith('/*',i)){const e=line.indexOf('*/',i+2);if(e<0){out+=sp('com',line.slice(i));return{h:out,st:1}}out+=sp('com',line.slice(i,e+2));i=e+2;continue}
      if(c==='"'||c==="'"||c==='`'){const s=readStr(line,i,c);
        if(lang==='json'&&/^\s*:/.test(line.slice(i+s.length))){out+=sp('attr',s)}else{out+=sp('str',s)}
        i+=s.length;continue}
      if(lang==='shell'&&c==='$'){const m=/^\$(\{[^}]*\}?|[\w@#?]+)/.exec(line.slice(i));if(m){out+=sp('attr',m[0]);i+=m[0].length;continue}}
      if(lang==='python'&&c==='@'&&/^@\w/.test(line.slice(i))){const m=/^@[\w.]+/.exec(line.slice(i));out+=sp('attr',m[0]);i+=m[0].length;continue}
      if(/\d/.test(c)&&(i===0||!/[\w$]/.test(line[i-1]))){const m=/^(0[xXbBoO][\da-fA-F]+|\d[\d_]*(\.\d+)?([eE][+-]?\d+)?)/.exec(line.slice(i));out+=sp('num',m[0]);i+=m[0].length;continue}
      if(/[A-Za-z_$]/.test(c)){const m=/^[\w$]+/.exec(line.slice(i))[0];const key=ci?m.toLowerCase():m;
        if(kw.has(key))out+=sp('key',m);
        else if(lit.has(m))out+=sp('lit',m);
        else if(/^\s*\(/.test(line.slice(i+m.length)))out+=sp('fn',m);
        else out+=esc(m);
        i+=m.length;continue}
      out+=esc(c);i++;
    }
    return{h:out,st}
  }
}

function hlTagStr(s){
  const m=/^(<\/?[!?]?)([\w:.-]*)/.exec(s);
  let o=esc(m[1])+(m[2]?sp('tag',m[2]):'');let r=s.slice(m[0].length);
  while(r.length){let mm;
    if((mm=/^\s+/.exec(r)))o+=mm[0];
    else if((mm=/^"[^"]*"?|^'[^']*'?/.exec(r)))o+=sp('str',mm[0]);
    else if((mm=/^[\w:.-]+/.exec(r)))o+=sp('attr',mm[0]);
    else{mm=[r[0]];o+=esc(mm[0])}
    r=r.slice(mm[0].length)}
  return o;
}
function mkMarkup(){
  return function(line,st){
    let out='',i=0;const n=line.length;
    if(st===1){const e=line.indexOf('-->');if(e<0)return{h:sp('com',line),st:1};out+=sp('com',line.slice(0,e+3));i=e+3;st=0}
    while(i<n){
      if(line.startsWith('<!--',i)){const e=line.indexOf('-->',i+4);if(e<0){out+=sp('com',line.slice(i));return{h:out,st:1}}out+=sp('com',line.slice(i,e+3));i=e+3;continue}
      if(line[i]==='<'){const m=/^<\/?[!?]?[A-Za-z][^<>]*(>|$)/.exec(line.slice(i));if(m){out+=hlTagStr(m[0]);i+=m[0].length;continue}}
      if(line[i]==='&'){const m=/^&[#\w]+;/.exec(line.slice(i));if(m){out+=sp('num',m[0]);i+=m[0].length;continue}}
      out+=esc(line[i]);i++;
    }
    return{h:out,st}
  }
}
function mkCss(){
  return function(line,st){
    let out='',i=0;const n=line.length;
    if(st===1){const e=line.indexOf('*/');if(e<0)return{h:sp('com',line),st:1};out+=sp('com',line.slice(0,e+2));i=e+2;st=0}
    while(i<n){
      const c=line[i];
      if(line.startsWith('/*',i)){const e=line.indexOf('*/',i+2);if(e<0){out+=sp('com',line.slice(i));return{h:out,st:1}}out+=sp('com',line.slice(i,e+2));i=e+2;continue}
      if(c==='"'||c==="'"){const s=readStr(line,i,c);out+=sp('str',s);i+=s.length;continue}
      if(c==='#'&&/^#[0-9a-fA-F]{3,8}\b/.test(line.slice(i))){const m=/^#[0-9a-fA-F]{3,8}/.exec(line.slice(i));out+=sp('num',m[0]);i+=m[0].length;continue}
      if(c==='@'){const m=/^@[\w-]+/.exec(line.slice(i));if(m){out+=sp('key',m[0]);i+=m[0].length;continue}}
      if(c==='!'&&/^!important/.test(line.slice(i))){out+=sp('key','!important');i+=10;continue}
      if(/\d/.test(c)&&(i===0||!/[\w-]/.test(line[i-1]))){const m=/^[\d.]+[\w%]*/.exec(line.slice(i));out+=sp('num',m[0]);i+=m[0].length;continue}
      if(/[A-Za-z-]/.test(c)){const m=/^[\w-]+/.exec(line.slice(i))[0];
        if(/^\s*:/.test(line.slice(i+m.length))&&!/[.#]$/.test(line[i-1]||''))out+=sp('attr',m);
        else if(/^\s*\(/.test(line.slice(i+m.length)))out+=sp('fn',m);
        else out+=esc(m);
        i+=m.length;continue}
      out+=esc(c);i++;
    }
    return{h:out,st}
  }
}
function mdInline(s){
  let out='',i=0;const n=s.length;
  while(i<n){
    const c=s[i];
    if(c==='`'){const e=s.indexOf('`',i+1);if(e>0){out+=sp('cd',s.slice(i,e+1));i=e+1;continue}}
    if(s.startsWith('**',i)){const e=s.indexOf('**',i+2);if(e>0){out+='<span class="tk-b">'+esc(s.slice(i,e+2))+'</span>';i=e+2;continue}}
    if(s.startsWith('~~',i)){const e=s.indexOf('~~',i+2);if(e>0){out+='<span class="tk-i">'+esc(s.slice(i,e+2))+'</span>';i=e+2;continue}}
    if(c==='*'||c==='_'){const e=s.indexOf(c,i+1);if(e>0&&e>i+1){out+='<span class="tk-i">'+esc(s.slice(i,e+1))+'</span>';i=e+1;continue}}
    if(c==='['){const m=/^\[([^\]]*)\](\(([^)]*)\))?/.exec(s.slice(i));if(m&&m[2]){out+=sp('lnk','['+m[1]+']')+sp('punc',m[2]);i+=m[0].length;continue}}
    out+=esc(c);i++;
  }
  return out;
}
function mkMd(){
  return function(line,st){
    if(/^\s*(```|~~~)/.test(line))return{h:sp('cd',line||'\u200b'),st:st===2?0:2};
    if(st===2)return{h:sp('str',line),st:2};
    if(/^#{1,6}\s/.test(line))return{h:'<span class="tk-h">'+esc(line)+'</span>',st:0};
    if(/^ {0,3}(-{3,}|\*{3,}|_{3,})\s*$/.test(line))return{h:sp('punc',line),st:0};
    if(/^\s*>/.test(line))return{h:'<span class="tk-q">'+mdInline(line)+'</span>',st:0};
    const li=/^(\s*)([-*+]|\d+\.)(\s+)(\[[ xX]\]\s+)?/.exec(line);
    if(li)return{h:esc(li[1])+sp('key',li[2])+li[3]+(li[4]?sp('lit',li[4]):'')+mdInline(line.slice(li[0].length)),st:0};
    return{h:mdInline(line),st:0};
  }
}
const TOKENIZERS={javascript:mkClike('javascript'),c:mkClike('c'),python:mkClike('python'),json:mkClike('json'),sql:mkClike('sql'),shell:mkClike('shell'),css:mkCss(),html:mkMarkup(),xml:mkMarkup(),markdown:mkMd()};

/* ============ RENDER PIPELINE ============ */
let hlRaf=0,curLineEl=null;
function scheduleRender(){if(hlRaf)return;hlRaf=requestAnimationFrame(()=>{hlRaf=0;renderHL()})}
function renderHL(){
  const t=tab();if(!t)return;
  const text=ta.value;const lines=text.split('\n');
  const tok=lines.length>9000?null:TOKENIZERS[t.lang];
  let st=0;const parts=new Array(lines.length);
  for(let k=0;k<lines.length;k++){
    let h;
    if(!tok)h=esc(lines[k]);else{const r=tok(lines[k],st);h=r.h;st=r.st}
    if(!h)h='\u200b';
    parts[k]='<div class="line"><span class="ln">'+(k+1)+'</span>'+h+'</div>';
  }
  hlCode.innerHTML=parts.join('');
  curLineEl=null;
  updateGutter(lines.length);
  applyMarks();
  markCurLine();
  fitHL();
  syncScroll();
  $('empty-hint').classList.toggle('show',text==='');
}
function updateGutter(count){
  const digits=Math.max(2,String(count).length);
  const gw=Math.round(22+digits*settings.fontSize*0.55);
  pane.style.setProperty('--gw',gw+'px');
}
function fitHL(){const sw=ta.offsetWidth-ta.clientWidth;hlPre.style.right=sw+'px'}
function syncScroll(){
  hlPre.scrollTop=ta.scrollTop;hlPre.scrollLeft=ta.scrollLeft;
  hlCode.style.setProperty('--sx',ta.scrollLeft+'px');
}
function caretLine(){return ta.value.slice(0,ta.selectionStart).split('\n').length-1}
function markCurLine(){
  if(curLineEl){curLineEl.classList.remove('cur');curLineEl=null}
  if(!settings.curLine)return;
  const el=hlCode.children[caretLine()];
  if(el){el.classList.add('cur');curLineEl=el}
}

/* ============ STATUS ============ */
function updateStatus(){
  const v=ta.value,s=ta.selectionStart,e=ta.selectionEnd;
  const before=v.slice(0,s);const ln=before.split('\n');
  $('sb-ln').textContent=ln.length;$('sb-col').textContent=ln[ln.length-1].length+1;
  const words=(v.match(/[\w\u00C0-\uFFFF'-]+/g)||[]).length;
  $('sb-words').textContent=words.toLocaleString();
  $('sb-chars').textContent=v.length.toLocaleString();
  $('sb-read').textContent='~'+Math.max(words?1:0,Math.round(words/200))+' min';
  const sel=$('sb-sel');
  if(e>s){const t=v.slice(s,e);sel.style.display='';sel.innerHTML='<b>'+(e-s).toLocaleString()+'</b>&nbsp;selected ('+((t.match(/[\w\u00C0-\uFFFF'-]+/g)||[]).length)+' words)'}
  else sel.style.display='none';
  markCurLine();
}

/* ============ EDIT PRIMITIVES (undo-friendly) ============ */
function insertText(s){
  ta.focus();
  let ok=false;
  try{ok=document.execCommand('insertText',false,s)}catch(_){}
  if(!ok){const st=ta.selectionStart,en=ta.selectionEnd;ta.setRangeText(s,st,en,'end');onInput()}
}
function replaceRange(s,st,en){ta.focus();ta.setSelectionRange(st,en);insertText(s)}
function setAll(s){ta.focus();ta.select();if(s==='')try{document.execCommand('delete')}catch(_){ta.setRangeText('',0,ta.value.length,'end');onInput()}else insertText(s)}
function lineSpan(){
  const v=ta.value;let s=ta.selectionStart,e=ta.selectionEnd;
  const ls=v.lastIndexOf('\n',s-1)+1;
  let le=v.indexOf('\n',e);if(le<0)le=v.length;
  return[ls,le];
}
function selOrAll(){const s=ta.selectionStart,e=ta.selectionEnd;return e>s?[s,e]:[0,ta.value.length]}
function transformSel(fn,label){
  const[a,b]=selOrAll();if(a===b){toast('Nothing to transform','info');return}
  replaceRange(fn(ta.value.slice(a,b)),a,b);
  if(label)toast(label,'ok');
}
function transformLines(fn,label){
  const[a,b]=lineSpan();const sel=ta.selectionEnd>ta.selectionStart?[a,b]:[0,ta.value.length];
  const seg=ta.value.slice(sel[0],sel[1]);
  replaceRange(fn(seg.split('\n')).join('\n'),sel[0],sel[1]);
  if(label)toast(label,'ok');
}
</script>
<script>
"use strict";
/* ============ TABS ============ */
function tab(){return tabs[active]}
function newTab(name,content,lang){
  tabs.push({id:tabSeq++,name:name||('Untitled '+(untitledSeq++)),content:content||'',saved:content||'',lang:lang||'text',handle:null});
  switchTab(tabs.length-1);
}
function switchTab(i){
  active=Math.max(0,Math.min(i,tabs.length-1));
  ta.value=tab().content;
  closeFindSilent();
  renderTabs();renderHL();updateStatus();updateLangUI();updatePreview();persistSoon();
  ta.setSelectionRange(0,0);ta.focus();
}
function isUnsaved(t){return t.content!==t.saved}
function closeTab(i){
  const t=tabs[i];
  const doClose=()=>{tabs.splice(i,1);if(!tabs.length){untitledSeq=1;newTab()}else switchTab(i>=tabs.length?tabs.length-1:(i<active?active-1:(i===active?Math.min(active,tabs.length-1):active)));renderTabs();persistSoon()};
  if(isUnsaved(t)&&t.content.trim())askConfirm('Close “'+t.name+'”?','This tab has changes that were never saved to a file. Its content stays in browser auto-save history only until the tab is closed.',doClose,'Close tab');
  else doClose();
}
let dragIdx=null;
function renderTabs(){
  const bar=$('tab-bar');bar.innerHTML='';
  tabs.forEach((t,i)=>{
    const el=document.createElement('div');
    el.className='tab'+(i===active?' active':'')+(isUnsaved(t)?' unsaved':'');
    el.draggable=true;el.title=t.name+(t.handle?' — linked to a local file':'');
    el.setAttribute('role','tab');el.tabIndex=0;
    const dot=document.createElement('span');dot.className='t-dot';
    const nm=document.createElement('span');nm.className='t-name';nm.textContent=t.name;
    const x=document.createElement('button');x.className='t-x';x.title='Close tab';
    x.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    x.onclick=e=>{e.stopPropagation();closeTab(i)};
    el.onclick=()=>switchTab(i);
    el.onauxclick=e=>{if(e.button===1)closeTab(i)};
    el.ondblclick=()=>renameTab(i,el,nm);
    el.onkeydown=e=>{if(e.key==='Enter')switchTab(i)};
    el.ondragstart=e=>{dragIdx=i;e.dataTransfer.effectAllowed='move'};
    el.ondragover=e=>{e.preventDefault();el.classList.add('dragover')};
    el.ondragleave=()=>el.classList.remove('dragover');
    el.ondrop=e=>{e.preventDefault();e.stopPropagation();el.classList.remove('dragover');
      if(dragIdx===null||dragIdx===i)return;
      const cur=tabs[active];const m=tabs.splice(dragIdx,1)[0];tabs.splice(i,0,m);
      active=tabs.indexOf(cur);dragIdx=null;renderTabs();persistSoon()};
    el.append(dot,nm,x);bar.appendChild(el);
  });
  const plus=document.createElement('button');plus.id='new-tab';plus.title='New tab (Ctrl+Alt+N)';
  plus.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
  plus.onclick=()=>newTab();bar.appendChild(plus);
}
function renameTab(i,el,nm){
  const t=tabs[i];const inp=document.createElement('input');
  inp.className='rename';inp.value=t.name;nm.replaceWith(inp);inp.focus();inp.select();
  const done=ok=>{if(ok&&inp.value.trim())t.name=inp.value.trim();renderTabs();persistSoon()};
  inp.onblur=()=>done(true);
  inp.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')done(true);if(e.key==='Escape')done(false)};
  inp.onclick=e=>e.stopPropagation();
}

/* ============ PERSISTENCE ============ */
let persistTimer=0;
function pill(state,label){const p=$('save-pill');p.className=state;$('save-label').textContent=label}
function persistSoon(){
  pill('saving','Saving…');
  clearTimeout(persistTimer);
  persistTimer=setTimeout(persistNow,settings.asDelay);
}
function persistNow(){
  try{
    localStorage.setItem(LS,JSON.stringify({v:2,active,untitledSeq,settings,tabs:tabs.map(t=>({name:t.name,content:t.content,saved:t.saved,lang:t.lang}))}));
    pill('saved','All changes saved');
  }catch(err){pill('','Not saved');toast('Auto-save failed — storage may be full','err')}
}
function loadPersisted(){
  try{
    const d=JSON.parse(localStorage.getItem(LS));
    if(!d||!d.tabs||!d.tabs.length)return false;
    Object.assign(settings,d.settings||{});
    untitledSeq=d.untitledSeq||1;
    tabs=d.tabs.map(t=>({id:tabSeq++,name:t.name,content:t.content||'',saved:t.saved!=null?t.saved:t.content||'',lang:t.lang||'text',handle:null}));
    active=Math.min(d.active||0,tabs.length-1);
    return true;
  }catch(_){return false}
}
function resetAll(){
  askConfirm('Reset NovaPad?','This permanently deletes every tab and all settings stored in this browser.',()=>{localStorage.removeItem(LS);location.reload()},'Reset everything');
}

/* ============ INPUT EVENTS ============ */
function onInput(){
  const t=tab();if(!t)return;
  t.content=ta.value;
  scheduleRender();updateStatus();persistSoon();
  renderTabsUnsavedOnly();
  if(findState.open)computeMatches(true);
  updatePreview();
}
function renderTabsUnsavedOnly(){
  const els=$('tab-bar').querySelectorAll('.tab');
  tabs.forEach((t,i)=>{if(els[i])els[i].classList.toggle('unsaved',isUnsaved(t))});
}

/* ============ FIND & REPLACE ============ */
const findState={open:false,matches:[],idx:-1,caseOn:false,word:false,regex:false};
function openFind(focusReplace){
  $('find-bar').classList.add('open');findState.open=true;
  const sel=ta.value.slice(ta.selectionStart,ta.selectionEnd);
  if(sel&&!sel.includes('\n'))$('find-input').value=sel;
  computeMatches(false);
  (focusReplace?$('replace-input'):$('find-input')).focus();
  $('find-input').select();
  $('btn-find').classList.add('on');
}
function closeFindSilent(){$('find-bar').classList.remove('open');findState.open=false;findState.matches=[];findState.idx=-1;$('btn-find').classList.remove('on')}
function closeFind(){
  const m=findState.matches[findState.idx];
  closeFindSilent();scheduleRender();
  ta.focus();if(m)ta.setSelectionRange(m.s,m.e);
}
function buildRegex(){
  let q=$('find-input').value;
  if(!q)return null;
  if(!findState.regex)q=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  if(findState.word)q='\\b(?:'+q+')\\b';
  try{return new RegExp(q,findState.caseOn?'g':'gi')}catch(_){return null}
}
function computeMatches(keepIdx){
  const re=buildRegex();const v=ta.value;
  const prev=findState.matches[findState.idx];
  findState.matches=[];
  if(re){let m,guard=0;
    while((m=re.exec(v))&&guard++<20000){
      if(!m[0].length){re.lastIndex++;continue}
      findState.matches.push({s:m.index,e:m.index+m[0].length});
      if(findState.matches.length>=5000)break;
    }}
  if(!findState.matches.length)findState.idx=-1;
  else if(keepIdx&&prev){findState.idx=Math.max(0,findState.matches.findIndex(x=>x.s>=prev.s));if(findState.idx<0)findState.idx=0}
  else{const c=ta.selectionStart;findState.idx=findState.matches.findIndex(x=>x.s>=c);if(findState.idx<0)findState.idx=0}
  updateFindCount();scheduleRender();
}
function updateFindCount(){
  const n=findState.matches.length;
  $('find-count').textContent=n?((findState.idx+1)+' of '+n):($('find-input').value?'No results':'Find');
}
function findNav(dir){
  const n=findState.matches.length;if(!n)return;
  findState.idx=(findState.idx+dir+n)%n;
  updateFindCount();scheduleRender();
}
function lineStarts(v){const a=[0];for(let i=0;i<v.length;i++)if(v[i]==='\n')a.push(i+1);return a}
function applyMarks(){
  if(!findState.open||!findState.matches.length)return;
  const v=ta.value;const ls=lineStarts(v);
  const byLine=new Map();
  findState.matches.forEach((m,mi)=>{
    let li=upperBound(ls,m.s)-1;
    let s=m.s;
    while(s<m.e){
      const lineEnd=(li+1<ls.length?ls[li+1]-1:v.length);
      const segEnd=Math.min(m.e,lineEnd);
      if(segEnd>s||m.s===m.e){
        if(!byLine.has(li))byLine.set(li,[]);
        byLine.get(li).push({s:s-ls[li],e:segEnd-ls[li],cur:mi===findState.idx});
      }
      li++;s=li<ls.length?ls[li]:v.length;
      if(li>=ls.length)break;
    }
  });
  byLine.forEach((ranges,li)=>{const el=hlCode.children[li];if(el)wrapMarks(el,ranges)});
  const cm=hlCode.querySelector('mark.cm');
  if(cm){
    const top=cm.getBoundingClientRect().top-hlPre.getBoundingClientRect().top+hlPre.scrollTop;
    if(top<ta.scrollTop+30||top>ta.scrollTop+ta.clientHeight-50)ta.scrollTop=Math.max(0,top-ta.clientHeight/2);
    syncScroll();
  }
}
function upperBound(a,x){let lo=0,hi=a.length;while(lo<hi){const m=(lo+hi)>>1;if(a[m]<=x)lo=m+1;else hi=m}return lo}
function textNodesOf(el,out){
  for(const n of el.childNodes){
    if(n.nodeType===3)out.push(n);
    else if(n.nodeType===1&&!n.classList.contains('ln'))textNodesOf(n,out);
  }
  return out;
}
function wrapMarks(lineEl,ranges){
  ranges.sort((a,b)=>a.s-b.s);
  const nodes=textNodesOf(lineEl,[]);
  let off=0;
  for(const node of nodes){
    const txt=node.nodeValue,len=txt.length,ns=off,ne=off+len;
    const overl=ranges.filter(r=>r.s<ne&&r.e>ns);
    if(overl.length){
      const frag=document.createDocumentFragment();let p=0;
      for(const r of overl){
        const a=Math.max(0,r.s-ns),b=Math.min(len,r.e-ns);
        if(a>p)frag.appendChild(document.createTextNode(txt.slice(p,a)));
        const mk=document.createElement('mark');if(r.cur)mk.className='cm';
        mk.textContent=txt.slice(a,b);frag.appendChild(mk);p=b;
      }

    }

  }

<script>
"use strict";
/* ============ MARKDOWN PREVIEW ============ */
function mdInlineHTML(s){
  const codes=[];
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,(_,c)=>{codes.push(c);return '\x00'+(codes.length-1)+'\x00'});
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g,(_,alt,src)=>/^(https?:|data:image)/.test(src)?'<img src="'+src+'" alt="'+alt+'">':alt);
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g,(_,txt,href)=>/^(https?:|mailto:|#)/.test(href)?'<a href="'+href+'" target="_blank" rel="noopener">'+txt+'</a>':txt);
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>');
  s=s.replace(/(^|\W)\*([^*\s][^*]*)\*/g,'$1<em>$2</em>').replace(/(^|\W)_([^_\s][^_]*)_/g,'$1<em>$2</em>');
  s=s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  s=s.replace(/\x00(\d+)\x00/g,(_,i)=>'<code>'+codes[+i]+'</code>');
  return s;
}
function renderMD(src){
  const lines=src.split('\n');const out=[];
  let i=0,para=[];
  const flush=()=>{if(para.length){out.push('<p>'+para.map(mdInlineHTML).join(' ')+'</p>');para=[]}};
  while(i<lines.length){
    const L=lines[i];
    if(/^\s*(```|~~~)/.test(L)){flush();const buf=[];i++;
      while(i<lines.length&&!/^\s*(```|~~~)/.test(lines[i]))buf.push(lines[i++]);
      i++;out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>');continue}
    const h=/^(#{1,6})\s+(.*)$/.exec(L);
    if(h){flush();out.push('<h'+h[1].length+'>'+mdInlineHTML(h[2].replace(/\s#+\s*$/,''))+'</h'+h[1].length+'>');i++;continue}
    if(/^ {0,3}(-{3,}|\*{3,}|_{3,})\s*$/.test(L)){flush();out.push('<hr>');i++;continue}
    if(/^\s*>/.test(L)){flush();const buf=[];
      while(i<lines.length&&/^\s*>/.test(lines[i]))buf.push(lines[i++].replace(/^\s*>\s?/,''));
      out.push('<blockquote>'+renderMD(buf.join('\n'))+'</blockquote>');continue}
    const li=/^\s*([-*+]|\d+\.)\s+/.exec(L);
    if(li){flush();const ordered=/\d/.test(li[1]);const items=[];
      while(i<lines.length){
        const m=/^\s*([-*+]|\d+\.)\s+(.*)$/.exec(lines[i]);if(!m)break;
        let body=m[2];const task=/^\[([ xX])\]\s+(.*)$/.exec(body);
        items.push('<li>'+(task?'<input type="checkbox" disabled'+(task[1]!==' '?' checked':'')+'>'+mdInlineHTML(task[2]):mdInlineHTML(body))+'</li>');i++;
      }
      out.push((ordered?'<ol>':'<ul>')+items.join('')+(ordered?'</ol>':'</ul>'));continue}
    if(/\|/.test(L)&&i+1<lines.length&&/^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i+1])){
      flush();const cells=r=>r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim());
      const head=cells(L);i+=2;const rows=[];
      while(i<lines.length&&/\|/.test(lines[i])&&lines[i].trim())rows.push(cells(lines[i++]));
      out.push('<table><thead><tr>'+head.map(c=>'<th>'+mdInlineHTML(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+mdInlineHTML(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>');continue}
    if(!L.trim()){flush();i++;continue}
    para.push(L);i++;
  }
  flush();return out.join('\n');
}

function titleCase(s){return s.replace(/[\w\u00C0-\uFFFF'-]+/g,w=>w[0].toUpperCase()+w.slice(1).toLowerCase())}
function sentenceCase(s){return s.toLowerCase().replace(/(^\s*[a-z\u00C0-\uFFFF])|([.!?]\s+[a-z\u00C0-\uFFFF])/g,m=>m.toUpperCase())}
function b64enc(s){try{return btoa(String.fromCharCode(...new TextEncoder().encode(s)))}catch(_){toast('Could not encode','err');return s}}
function b64dec(s){try{return new TextDecoder().decode(Uint8Array.from(atob(s.trim()),c=>c.charCodeAt(0)))}catch(_){toast('Not valid Base64','err');return s}}
function jsonTool(pretty){
  const[a,b]=selOrAll();const seg=ta.value.slice(a,b);
  try{const o=JSON.parse(seg);replaceRange(JSON.stringify(o,null,pretty?2:0),a,b);toast(pretty?'JSON formatted':'JSON minified','ok')}
  catch(e){toast('Invalid JSON: '+e.message.slice(0,60),'err')}
}
function toggleComment(){
  const t=tab();const p=COMMENT_PREFIX[t.lang]||'#';
  const wrap=p==='/*'||p==='<!--';
  const close=p==='/*'?' */':' -->';
  const[a,b]=lineSpan();const seg=ta.value.slice(a,b);const arr=seg.split('\n');
  const allOn=arr.filter(l=>l.trim()).every(l=>l.trim().startsWith(p));
  const outArr=arr.map(l=>{
    if(!l.trim())return l;
    if(allOn){let r=l.replace(new RegExp('^(\\s*)'+p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s?'),'$1');
      if(wrap)r=r.replace(/\s?(\*\/|-->)\s*$/,'');return r}
    return l.replace(/^(\s*)/,'$1'+p+' ')+(wrap?close:'');
  });
  const caret=ta.selectionStart;
  replaceRange(outArr.join('\n'),a,b);
  ta.setSelectionRange(a,a+outArr.join('\n').length);
}
function duplicateLine(){const[a,b]=lineSpan();const seg=ta.value.slice(a,b);const c=ta.selectionStart;replaceRange(seg+'\n'+seg,a,b);ta.setSelectionRange(c+seg.length+1,c+seg.length+1);updateStatus()}
function deleteLine(){let[a,b]=lineSpan();if(b<ta.value.length)b++;else if(a>0)a--;replaceRange('',a,b);updateStatus()}
function moveLine(dir){
  const v=ta.value;const[a,b]=lineSpan();const c=ta.selectionStart,cEnd=ta.selectionEnd;
  if(dir<0){
    if(a===0)return;const pa=v.lastIndexOf('\n',a-2)+1;const prev=v.slice(pa,a-1);const seg=v.slice(a,b);
    replaceRange(seg+'\n'+prev,pa,b);ta.setSelectionRange(c-prev.length-1,cEnd-prev.length-1);
  }else{
    if(b>=v.length)return;let nb=v.indexOf('\n',b+1);if(nb<0)nb=v.length;const next=v.slice(b+1,nb);const seg=v.slice(a,b);
    replaceRange(next+'\n'+seg,a,nb);ta.setSelectionRange(c+next.length+1,cEnd+next.length+1);
  }
  updateStatus();
}

function toggleDictation(){

let palSel=0,palItems=[];

function fuzzy(q,s){
  q=q.toLowerCase();s=s.toLowerCase();
  if(!q)return 1;
  if(s.includes(q))return 100-s.indexOf(q);
  let i=0;for(const ch of s){if(ch===q[i])i++;if(i===q.length)return 10}
  return i===q.length?10:0;
}
function palFilter(q){
  palItems=commands.map(c=>({c,score:Math.max(fuzzy(q,c.t),fuzzy(q,c.cat))})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).map(x=>x.c);
  palSel=0;renderPal();
}
function renderPal(){
  const list=$('pal-list');
  if(!palItems.length){list.innerHTML='<div class="pal-empty">No matching commands</div>';return}
  list.innerHTML=palItems.map((c,i)=>'<button class="pal-item'+(i===palSel?' sel':'')+'" onclick="palRun('+i+')"><span>'+c.t+'</span><span class="cat">'+c.cat+'</span>'+(c.sc?'<span class="sc"><kbd>'+c.sc+'</kbd></span>':'')+'</button>').join('');
  const sel=list.children[palSel];if(sel)sel.scrollIntoView({block:'nearest'});
}

/* ============ KEYBOARD ============ */
const PAIRS={'(':')','[':']','{':'}','"':'"',"'":"'",'`':'`'};
ta.addEventListener('keydown',e=>{
  if(e.key==='Tab'){
    e.preventDefault();
    const unit=' '.repeat(settings.tabSize);
    const s=ta.selectionStart,en=ta.selectionEnd;
    if(s!==en&&ta.value.slice(s,en).includes('\n')){
      const[a,b]=lineSpan();const seg=ta.value.slice(a,b);
      const out=seg.split('\n').map(l=>e.shiftKey?l.replace(new RegExp('^('+unit+'|\\t| {1,'+settings.tabSize+'})'),''):unit+l).join('\n');
      replaceRange(out,a,b);ta.setSelectionRange(a,a+out.length);
    }else if(e.shiftKey){
      const[a]=lineSpan();const m=new RegExp('^('+unit+'|\\t| {1,'+settings.tabSize+'})').exec(ta.value.slice(a));
      if(m)replaceRange('',a,a+m[1].length);
    }else insertText(unit);
    return;
  }
  if(e.key==='Enter'&&!e.ctrlKey&&!e.metaKey){
    const s=ta.selectionStart;
    const ls=ta.value.lastIndexOf('\n',s-1)+1;
    const line=ta.value.slice(ls,s);
    const ind=(/^[ \t]*/.exec(line))[0];
    const prevCh=ta.value[s-1],nextCh=ta.value[s];
    if(prevCh&&PAIRS[prevCh]&&PAIRS[prevCh]===nextCh&&'([{'.includes(prevCh)){
      e.preventDefault();insertText('\n'+ind+' '.repeat(settings.tabSize)+'\n'+ind);
      const p=s+1+ind.length+settings.tabSize;ta.setSelectionRange(p,p);updateStatus();return;
    }
    if(ind){e.preventDefault();insertText('\n'+ind);return}
    return;
  }
  if(e.altKey&&!e.ctrlKey&&!e.metaKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();moveLine(e.key==='ArrowUp'?-1:1);return}
  if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&PAIRS[e.key]){
    const s=ta.selectionStart,en=ta.selectionEnd;
    if(en>s){e.preventDefault();const sel=ta.value.slice(s,en);insertText(e.key+sel+PAIRS[e.key]);ta.setSelectionRange(s+1,s+1+sel.length);return}
    if('"\'`'.includes(e.key)&&ta.value[s]===e.key){e.preventDefault();ta.setSelectionRange(s+1,s+1);updateStatus();return}
    if('([{'.includes(e.key)){e.preventDefault();insertText(e.key+PAIRS[e.key]);ta.setSelectionRange(s+1,s+1);return}
    if('"\'`'.includes(e.key)){
      const before=ta.value[s-1];
      if(!before||/[\s([{,:=]/.test(before)){e.preventDefault();insertText(e.key+PAIRS[e.key]);ta.setSelectionRange(s+1,s+1);return}
    }
    return;
  }
  if((e.key===')'||e.key===']'||e.key==='}')&&!e.ctrlKey&&!e.metaKey){
    const s=ta.selectionStart;
    if(ta.selectionEnd===s&&ta.value[s]===e.key){e.preventDefault();ta.setSelectionRange(s+1,s+1);updateStatus();return}
  }
  if(e.key==='Backspace'&&!e.ctrlKey&&!e.metaKey){
    const s=ta.selectionStart;
    if(ta.selectionEnd===s&&s>0&&PAIRS[ta.value[s-1]]===ta.value[s]){e.preventDefault();replaceRange('',s-1,s+1);return}
  }
});

<script>
"use strict";
/* ============ MULTI-CURSOR & COLUMN SELECT (Notepad++ style) ============ */
const mcLayer=document.createElement('div');mcLayer.id='mc-layer';
pane.insertBefore(mcLayer,ta);
const mc={on:false,sels:[]};
let colDrag=null,mcHinted=false;

function mcNorm(sels){
  sels=sels.map(s=>({s:Math.min(s.s,s.e),e:Math.max(s.s,s.e)})).sort((a,b)=>a.s-b.s||a.e-b.e);
  const out=[];
  for(const s of sels){
    const p=out[out.length-1];
    if(p&&(s.s<p.e||(s.s===p.s&&s.e===p.e)||(s.s===p.e&&(s.s===s.e||p.s===p.e))))p.e=Math.max(p.e,s.e);
    else out.push({s:s.s,e:s.e});
  }
  return out;
}
function mcExit(){
  mc.on=false;mc.sels=[];colDrag=null;
  document.body.classList.remove('mc-on');
  mcLayer.innerHTML='';
}
function mcCommitState(){
  mc.sels=mcNorm(mc.sels);
  if(mc.sels.length<=1){
    const s=mc.sels[0];
    mcExit();
    if(s)ta.setSelectionRange(s.s,s.e);
    mcRender();updateStatus();return;
  }
  mc.on=true;document.body.classList.add('mc-on');
  const last=mc.sels[mc.sels.length-1];
  ta.setSelectionRange(last.e,last.e);
  mcRender();updateStatus();
  if(!mcHinted){mcHinted=true;toast('Multi-cursor: type to edit every line \u2014 Esc to exit','info')}
}

/* --- geometry --- */
function mcLineLen(ls,li,v){return (li+1<ls.length?ls[li+1]-1:v.length)-ls[li]}
function mcRangeIn(li,a,b){
  const div=hlCode.children[li];if(!div)return null;
  const nodes=textNodesOf(div,[]);if(!nodes.length)return null;
  const r=document.createRange();let off=0,started=false;
  for(const n of nodes){
    const len=n.nodeValue.length;
    if(!started&&a<=off+len){r.setStart(n,Math.max(0,Math.min(len,a-off)));started=true}
    if(started&&b<=off+len){r.setEnd(n,Math.max(0,Math.min(len,b-off)));return r}
    off+=len;
  }
  const lastN=nodes[nodes.length-1];
  if(!started)r.setStart(lastN,lastN.nodeValue.length);
  r.setEnd(lastN,lastN.nodeValue.length);
  return r;
}
function mcCaretRect(li,col){
  let r=mcRangeIn(li,col,col+1),rects=r?r.getClientRects():[];
  if(rects.length)return{x:rects[0].left,y:rects[0].top,h:rects[0].height};
  r=mcRangeIn(li,Math.max(0,col-1),col);rects=r?r.getClientRects():[];
  if(rects.length){const rc=rects[rects.length-1];return{x:rc.right,y:rc.top,h:rc.height}}
  const div=hlCode.children[li];if(!div)return null;
  const dr=div.getBoundingClientRect();
  return{x:dr.left+(parseFloat(getComputedStyle(div).paddingLeft)||0),y:dr.top,h:settings.fontSize*settings.lineHeight};
}
function mcRender(){
  mcLayer.innerHTML='';
  if(!mc.sels.length)return;
  const v=ta.value,ls=lineStarts(v);
  const pr=mcLayer.getBoundingClientRect();
  const frag=document.createDocumentFragment();
  const add=(x,y,w,h,cls)=>{
    if(y+h<pr.top-40||y>pr.bottom+40)return;
    const d=document.createElement('div');d.className=cls;
    d.style.left=(x-pr.left)+'px';d.style.top=(y-pr.top)+'px';
    if(w!=null)d.style.width=Math.max(2,w)+'px';
    d.style.height=h+'px';frag.appendChild(d);
  };
  for(const sel of mc.sels){
    const l1=upperBound(ls,sel.s)-1;
    if(sel.s===sel.e){
      const rc=mcCaretRect(l1,sel.s-ls[l1]);
      if(rc)add(rc.x,rc.y,null,rc.h,'mc-caret');
      continue;
    }
    const l2=upperBound(ls,sel.e)-1;
    for(let li=l1;li<=l2;li++){
      const a=li===l1?sel.s-ls[li]:0;
      const b=li===l2?sel.e-ls[li]:mcLineLen(ls,li,v);
      if(b<=a){const rc=mcCaretRect(li,a);if(rc)add(rc.x,rc.y,null,rc.h,'mc-caret');continue}
      const r=mcRangeIn(li,a,b);if(!r)continue;
      for(const rc of r.getClientRects())add(rc.left,rc.top,rc.width,rc.height,'mc-sel');
    }
  }
  mcLayer.appendChild(frag);
}
/* keep overlay in sync with rendering & scrolling */
const _renderHL=renderHL;renderHL=function(){_renderHL();mcRender()};
const _syncScroll=syncScroll;syncScroll=function(){_syncScroll();mcRender()};
const _updateStatus=updateStatus;updateStatus=function(){_updateStatus();if(mc.on){const el=$('sb-sel');el.style.display='';el.innerHTML='<b>'+mc.sels.length+'</b>&nbsp;cursors'}};

/* --- point -> text position (uses the highlight layer for exact metrics) --- */
function posFromPoint(x,y){
  let node=null,off=0;
  const prev=ta.style.pointerEvents;
  ta.style.pointerEvents='none';
  try{
    if(document.caretRangeFromPoint){const r=document.caretRangeFromPoint(x,y);if(r){node=r.startContainer;off=r.startOffset}}
    else if(document.caretPositionFromPoint){const p=document.caretPositionFromPoint(x,y);if(p){node=p.offsetNode;off=p.offset}}
  }catch(_){}
  ta.style.pointerEvents=prev;
  if(!node)return null;
  const el=node.nodeType===3?node.parentElement:node;
  const div=el&&el.closest?el.closest('.line'):null;
  if(!div||!hlCode.contains(div))return null;
  const li=Array.prototype.indexOf.call(hlCode.children,div);
  if(li<0)return null;
  let col=0;
  if(node.nodeType===3){
    const nodes=textNodesOf(div,[]);
    let found=false;
    for(const n of nodes){if(n===node){col+=off;found=true;break}col+=n.nodeValue.length}
    if(!found)col=0;
  }
  const v=ta.value,ls=lineStarts(v);
  col=Math.min(col,mcLineLen(ls,li,v));
  return{li,col,pos:ls[li]+col};
}
function colAtX(li,x){
  const div=hlCode.children[li];if(!div)return 0;
  const dr=div.getBoundingClientRect();
  const rowH=settings.fontSize*settings.lineHeight;
  const y=dr.top+Math.min(dr.height-1,rowH/2);
  const p=posFromPoint(x,y);
  if(p&&p.li===li)return p.col;
  const v=ta.value,ls=lineStarts(v);
  return x>dr.left?mcLineLen(ls,li,v):0;
}

/* --- mouse: Alt+drag / Ctrl+Shift+drag = column select, Ctrl+Click = add cursor --- */
ta.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  const isCol=(e.altKey&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey)||(e.shiftKey&&(e.ctrlKey||e.metaKey));
  const isAdd=!e.altKey&&!e.shiftKey&&(IS_MAC?e.metaKey:e.ctrlKey);
  if(isCol){
    e.preventDefault();ta.focus();
    const p=posFromPoint(e.clientX,e.clientY);
    colDrag={x0:e.clientX,li0:p?p.li:hlCode.children.length-1};
    try{ta.setPointerCapture(e.pointerId)}catch(_){}
    mcColUpdate(e);
  }else if(isAdd){
    e.preventDefault();ta.focus();
    const p=posFromPoint(e.clientX,e.clientY);
    if(!p)return;
    const sels=mc.on?mc.sels.slice():[{s:ta.selectionStart,e:ta.selectionEnd}];
    const i=sels.findIndex(s=>s.s===p.pos&&s.e===p.pos);
    if(i>=0&&sels.length>1)sels.splice(i,1);else sels.push({s:p.pos,e:p.pos});
    mc.sels=sels;mcCommitState();
  }else if(mc.on){
    mcExit();mcRender();
  }
});
ta.addEventListener('pointermove',e=>{if(colDrag){e.preventDefault();mcColUpdate(e)}});
ta.addEventListener('pointerup',()=>{if(colDrag){colDrag=null;mcCommitState()}});
function mcColUpdate(e){
  const n=hlCode.children.length;if(!n||!colDrag)return;
  const first=hlCode.children[0].getBoundingClientRect();
  const last=hlCode.children[n-1].getBoundingClientRect();
  const y=Math.max(first.top+1,Math.min(e.clientY,last.bottom-2));
  const p=posFromPoint(e.clientX,y);
  const li1=p?p.li:(y>last.top?n-1:0);
  const a=Math.min(colDrag.li0,li1),b=Math.max(colDrag.li0,li1);
  const xL=Math.min(colDrag.x0,e.clientX),xR=Math.max(colDrag.x0,e.clientX);
  const v=ta.value,ls=lineStarts(v);
  const sels=[];
  for(let li=a;li<=b;li++){
    const c1=colAtX(li,xL),c2=colAtX(li,xR);
    sels.push({s:ls[li]+Math.min(c1,c2),e:ls[li]+Math.max(c1,c2)});
  }
  mc.sels=sels;mc.on=true;document.body.classList.add('mc-on');
  mcRender();
}

/* --- apply one edit to every cursor (single undo step) --- */
function mcApply(fn){
  const v=ta.value;
  const sels=mcNorm(mc.sels);
  const st=ta.scrollTop,sl=ta.scrollLeft;
  let out='',prev=0;const newSels=[];let i=0;
  for(const sel of sels){
    out+=v.slice(prev,sel.s);
    const res=fn(v.slice(sel.s,sel.e),i++,sel);
    const text=typeof res==='string'?res:res.t;
    newSels.push({s:out.length+text.length,e:out.length+text.length});
    out+=text;prev=sel.e;
  }
  out+=v.slice(prev);
  ta.focus();
  ta.setSelectionRange(0,v.length);
  try{if(out==='')document.execCommand('delete');else document.execCommand('insertText',false,out)}catch(_){}
  if(ta.value!==out)ta.value=out;
  mc.sels=newSels;
  mc.on=newSels.length>1;
  document.body.classList.toggle('mc-on',mc.on);
  const lastSel=newSels[newSels.length-1]||{s:out.length,e:out.length};
  ta.setSelectionRange(lastSel.s,lastSel.e);
  ta.scrollTop=st;ta.scrollLeft=sl;
  onInput();renderHL();updateStatus();
}

/* --- keyboard --- */
document.addEventListener('keydown',e=>{
  const mod=IS_MAC?e.metaKey:e.ctrlKey;
  if(mod&&e.altKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')&&document.activeElement===ta){
    e.preventDefault();e.stopPropagation();
    mcAddLine(e.key==='ArrowDown'?1:-1);return;
  }
  if(!mc.on)return;
  if(e.target!==ta)return;
  if(['Shift','Control','Alt','Meta','CapsLock'].includes(e.key))return;
  if(e.key==='Escape'){
    e.preventDefault();e.stopPropagation();
    const s=mc.sels[mc.sels.length-1];
    mcExit();mcRender();
    if(s)ta.setSelectionRange(s.e,s.e);
    updateStatus();return;
  }
  const k=e.key.toLowerCase();
  if(mod&&(k==='z'||k==='y')){mcExit();mcRender();updateStatus();return}
  if(mod&&(k==='c'||k==='x')){
    if(!mc.sels.some(s=>s.e>s.s))return;
    e.preventDefault();e.stopPropagation();
    const v=ta.value;const txt=mc.sels.map(s=>v.slice(s.s,s.e)).join('\n');
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).catch(()=>{});
    if(k==='x')mcApply(()=>'');
    return;
  }
  if(mod&&k==='v')return;
  if(mod||e.key.startsWith('Arrow')||['Home','End','PageUp','PageDown'].includes(e.key)){
    mcExit();mcRender();updateStatus();return;
  }
  if(e.key==='Tab'){e.preventDefault();e.stopPropagation();mcApply(()=>' '.repeat(settings.tabSize));return}
  if(e.key==='Enter'){e.preventDefault();e.stopPropagation();mcApply(()=>'\n');return}
  if(e.key==='Backspace'){
    e.preventDefault();e.stopPropagation();
    mc.sels=mcNorm(mc.sels.map(s=>s.s===s.e?{s:Math.max(0,s.s-1),e:s.e}:s));
    mcApply(()=>'');return;
  }
  if(e.key==='Delete'){
    e.preventDefault();e.stopPropagation();
    const len=ta.value.length;
    mc.sels=mcNorm(mc.sels.map(s=>s.s===s.e?{s:s.s,e:Math.min(len,s.e+1)}:s));
    mcApply(()=>'');return;
  }
  if(e.key.length===1&&!e.altKey){
    e.preventDefault();e.stopPropagation();
    const ch=e.key;mcApply(()=>ch);return;
  }
},true);

/* paste across all cursors: line-per-cursor when counts match */
ta.addEventListener('paste',e=>{
  if(!mc.on)return;
  e.preventDefault();e.stopPropagation();
  const txt=(e.clipboardData?e.clipboardData.getData('text'):'')||'';
  const lines=txt.replace(/\r/g,'').split('\n');
  if(lines.length===mc.sels.length)mcApply((t,i)=>lines[i]);
  else mcApply(()=>txt);
},true);

/* --- add cursor above / below (Ctrl+Alt+Up/Down) --- */
function mcAddLine(dir){
  ta.focus();
  const v=ta.value,ls=lineStarts(v);
  const sels=mc.on?mc.sels.slice():[{s:ta.selectionStart,e:ta.selectionEnd}];
  const ref=dir<0?sels.reduce((a,b)=>a.s<=b.s?a:b):sels.reduce((a,b)=>a.s>=b.s?a:b);
  const anchor=dir<0?ref.s:ref.e;
  const li=upperBound(ls,anchor)-1;
  const col=anchor-ls[li];
  const nli=li+dir;
  if(nli<0||nli>=ls.length)return;
  const pos=ls[nli]+Math.min(col,mcLineLen(ls,nli,v));
  sels.push({s:pos,e:pos});
  mc.sels=sels;mcCommitState();
}

/* --- register in palette & shortcuts dialog --- */
commands.push(
  {id:'caretAbove',t:'Add cursor above',cat:'Multi-cursor',sc:MOD+'+Alt+\u2191',run:()=>mcAddLine(-1)},
  {id:'caretBelow',t:'Add cursor below',cat:'Multi-cursor',sc:MOD+'+Alt+\u2193',run:()=>mcAddLine(1)}
);
commands.forEach(c=>{cmdById[c.id]=c});
const _buildKeys=buildKeys;
buildKeys=function(){
  _buildKeys();
  $('keys-body').innerHTML+='<div class="sc-row"><span>Column (box) selection</span><kbd>Alt+drag / '+MOD+'+Shift+drag</kbd></div><div class="sc-row"><span>Add / remove a cursor</span><kbd>'+MOD+'+Click</kbd></div>';
};
</script>
